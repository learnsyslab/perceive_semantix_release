[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "perceive_semantix_lib"
version = "0.0.2"

[package.build]
backend = { name = "pixi-build-python", version = ">=0.3.2" }

[package.host-dependencies]
hatchling = "*"

[package.run-dependencies]
ultralytics = "*"
open-clip-torch = "*"
jaxtyping = "*"
supervision = "*"
typeguard = "2.*" # apparently version 3.* and 4.* have some issues for jaxtyping
rerun-sdk = "*"
openai = "*"
joblib = "*"
py-opencv = "*"
